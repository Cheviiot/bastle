<title id="bastle-master-title">Bastle · Obsidian Glass</title>
<desc id="bastle-master-desc">Bastle: отдельные настольные веб-приложения с независимыми профилями. Три фронтальные стеклянные панели на обсидиане, тонкая бронза и красная отметка активного окна. Без перспективы и объёмных торцов.</desc>
