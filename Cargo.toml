# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "bastle"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cheviiot/bastle"
description = "Install isolated web apps that integrate with GNOME"

[features]
ui-tests = []

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
futures = "0.3.30"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
glycin = { version = "3.1", features = ["gdk4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
isahc = "1.8.2"
rand = "0.8.5"
scraper = { version = "0.27.0", features = ["atomic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
url = { version = "2.5.8", features = ["serde"] }

[dependencies.ashpd]
package = "ashpd"
version = "0.13.13"
features = ["async-io", "gtk4", "dynamic_launcher"]
default-features = false

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_22"]

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_9"]

[dependencies.webkit]
package = "webkit6"
version = "0.6"
features = ["v2_52"]
