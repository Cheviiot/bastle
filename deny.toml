# SPDX-License-Identifier: GPL-3.0-only

[advisories]
ignore = [
  # Transitive through the current glycin stack. Remove when upstream no longer
  # depends on paste. Tracked in the Bastle issue tracker.
  "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
