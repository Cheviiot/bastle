name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  flatpak-release:
    name: Release Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@aa777012a985fe1b1fd3e66ea2173609cf0c9a70
        with:
          bundle: Bastle-x86_64.flatpak
          manifest-path: build-aux/io.github.cheviiot.bastle.json
          arch: x86_64
          upload-artifact: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" Bastle-x86_64.flatpak
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
