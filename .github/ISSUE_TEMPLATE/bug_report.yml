name: Bug report
description: Report reproducible broken behavior in Bastle
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, cookies, tokens, or private site data.
  - type: input
    id: version
    attributes:
      label: Bastle version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Desktop and Flatpak runtime
      placeholder: GNOME 50 on Wayland, org.gnome.Platform 50
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
